name: Validate MVP
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orm
          POSTGRES_PASSWORD: orm
          POSTGRES_DB: orm_dev
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U orm -d orm_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://orm:orm@127.0.0.1:55432/orm_dev
      DATABASE_URL_UNPOOLED: postgresql://orm:orm@127.0.0.1:55432/orm_dev
      TEST_DATABASE_URL: postgresql://orm:orm@127.0.0.1:55432/orm_test
      DEMO_TOKEN_SECRET: ci-only-fictional-demo-secret-not-for-production
      CRON_SECRET: ci-only-maintenance-secret-not-for-production
      APP_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: PGPASSWORD=orm psql -h 127.0.0.1 -p 55432 -U orm -d orm_dev -c 'CREATE DATABASE orm_test'
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:contract
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-evidence
          path: test-results/
          retention-days: 7
